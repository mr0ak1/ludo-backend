version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: ludo-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DB: ludo_game
    volumes:
      - mongodb_data:/data/db
    networks:
      - ludo-network

  redis:
    image: redis:7-alpine
    container_name: ludo-redis
    ports:
      - "6379:6379"
    networks:
      - ludo-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ludo-backend
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://root:root@mongodb:27017/ludo_game?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your_jwt_secret_key_here
      PORT: 5000
      SOCKET_PORT: 5001
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./src:/app/src
    networks:
      - ludo-network

volumes:
  mongodb_data:

networks:
  ludo-network:
    driver: bridge
